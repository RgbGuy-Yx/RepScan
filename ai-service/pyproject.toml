[project]
name = "repscan-ai-service"
version = "1.0.0"
description = "RepScan — AI service for ChromaDB, embeddings, and intelligent analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "chromadb>=0.5.0",
    "langchain-core>=1.6.3",
    "langchain-mistralai>=1.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.11",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
